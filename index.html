footer{margin-top:26px;color:var(--muted);font-size:var(--fs-sm)}

/* Public, read-only status relay (Cloudflare Worker + KV). The rig is
   the only thing that can write to it, gated by a secret Bearer key
   that never appears here; this page only ever performs the public GET. */
const STATUS_ENDPOINT = 'https://trujara-status.genplay110.workers.dev';

/* Same destination as the "Contact us" button on the main site. */
const CONTACT_EMAIL = 'hello@trujara.com';

const FILES = [
{path:'readme.txt', mtime:'2026-09-22T10:02', body:
`trujara-node01

Compute you can verify, not just trust.

This site is laid out as a real filesystem,
not a summary of one. Each file is the
actual content, not a description of it.

Every file has a SHA-256 hash, and
manifest.sha256 lists them all. Type
"verify" in the prompt below to recompute
each hash in your browser and check it
against the manifest yourself. Type "help"
for every other command.

Start here
  compute.txt       what does the work
  power.txt         how it stays powered
  network.txt       how it stays reachable
  monitoring.txt    how it's watched
  status/live.json  what it's doing now
  company/          who's behind this
  latest            where the build is today
`},
{path:'compute.txt', mtime:'2026-09-22T09:40', body:
`hardware  best-in-class GPU hardware
build     single high-performance node

One node, engineered the same way we'd
engineer our tenth: full-capability hardware
handling AI inference jobs and compute
workloads across multiple decentralized
networks, not a scaled-down starting point.
`, badge:{label:'OPERATIONAL', kind:'ok'}},
{path:'power.txt', mtime:'2026-09-25T09:44', body:
`layer 1   primary utility power
layer 2   independent backup power
layer 3   reserve energy capacity
layer 4   hardware-level failover

Each layer covers the one in front of it.
If the primary source drops, backup power
takes the load automatically, drawing on
reserve capacity behind it. A hardware-level
failover bridges the instant of that handover
directly at the node, so no gap in the chain
ever reaches the GPU.

See status/live.json for which layer is
active right now.
`, badge:{label:'OPERATIONAL', kind:'ok'}},
{path:'network.txt', mtime:'2026-09-25T09:48', body:
`link 1    primary connection
link 2    secondary connection
link 3    tertiary connection

Each link covers the one before it. If the
primary connection drops, the secondary
takes over automatically; if that fails
too, the tertiary link keeps the node
reachable. No single connection going
down takes the node offline.

See status/live.json for which link is
active right now.
`, badge:{label:'OPERATIONAL', kind:'ok'}},
{path:'monitoring.txt', mtime:'2026-09-22T09:50', body:
`telemetry temperature
          uptime
          network health

Watched around the clock, so issues are
caught before they cost compute time.
`, badge:{label:'OPERATIONAL', kind:'ok'}},

  renderCrumbs(p);
  if (!n){ cwd = parentOf(p); renderMissing(p); }
  else if (n.type === 'dir'){ cwd = p; renderDir(n); }
  else { cwd = parentOf(p); n.type === 'link' ? renderLink(n) : renderFile(n); }
  document.title = 'trujara-node01:/' + p;
  $('#ps').textContent = `guest@trujara-node01:/${cwd}$`;
  if (p === 'status/live.json' && n && n.dynamic){ startLivePolling(n); startTick(n); }
}
window.addEventListener('hashchange', () => show(currentPath()));
const go = p => { if (currentPath() === p) show(p); else location.hash = href(p); };

/* ---------- terminal ---------- */
const out = $('#out'), input = $('#cmd');
function print(text, cls){
  out.append(el('div', {class:'line ' + (cls||''), text}));
  out.scrollTop = out.scrollHeight;
}
function treeLines(d, prefix, lines){
  d.children.forEach((c, i) => {
    const last = i === d.children.length - 1;
    lines.push(prefix + (last ? '\u2514\u2500 ' : '\u251c\u2500 ') + c.name + (c.type==='dir' ? '/' : c.type==='link' ? ' -> ' + c.link : ''));
    if (c.type === 'dir') treeLines(c, prefix + (last ? '   ' : '\u2502  '), lines);
  });
  return lines;
}
async function verify(){
  if (!hashed()[0].hash){ print('This browser can\u2019t compute SHA-256 here. Open the site over https.', 'bad'); return; }
  const man = nodes.get('manifest.sha256');
  const expected = man.body.trim().split('\n').map(l => { const m = l.match(/^(\S+)\s+(.+)$/); return [m[2], m[1]]; });
  print('recomputing ' + expected.length + ' hashes against manifest.sha256');
  let ok = 0;
  for (const [path, h] of expected){
    const n = nodes.get(path);
    const now = n ? await sha256(n.body) : null;
    const pass = now === h;
    if (pass) ok++;
    print((pass ? 'OK    ' : 'FAIL  ') + path, pass ? 'ok' : 'bad');
    await wait(70);
  }
  print(`${ok} of ${expected.length} files match the manifest`, ok === expected.length ? 'ok' : 'bad');
}
const HELP = [
  'ls [path]         list a folder',
  'cd [path]         open a folder',
  'cat <file>        print a file here',
  'open <path>       show a file or folder above',
  'tree              show every file',
  'sha256sum [file]  print hashes',
  'verify            check every file against the manifest',
  'pwd, whoami, clear',
];
const history = []; let hi = 0;
async function run(line){
  line = line.trim(); if (!line) return;
  history.push(line); hi = history.length;
  print(`${$('#ps').textContent} ${line}`, 'echo');
  const [cmd, arg] = line.split(/\s+/);
  const target = resolve(arg, cwd);
  const n = nodes.get(target);
  switch (cmd){
    case 'help': HELP.forEach(h => print(h)); break;
    case 'ls': {
      const d = deref(n);
      if (!d) print(`ls: ${arg}: no such file or folder`, 'bad');
      else if (d.type !== 'dir') print(d.name);
      else d.children.forEach(c => print(c.type==='dir' ? c.name + '/' : c.type==='link' ? `${c.name} -> ${c.link}` : c.name, c.type==='dir' ? 'dir' : ''));
      break; }
    case 'cd': {
      const d = arg ? deref(n) : nodes.get('');
      if (!d) print(`cd: ${arg}: no such folder`, 'bad');
      else if (d.type !== 'dir') print(`cd: ${arg}: not a folder`, 'bad');
      else go(d.path);
      break; }
    case 'cat': {
      const f = deref(n);
      if (!arg) print('cat: name a file, for example: cat latest', 'bad');
      else if (!f) print(`cat: ${arg}: no such file`, 'bad');
      else if (f.type === 'dir') print(`cat: ${arg}: is a folder`, 'bad');
      else f.body.replace(/\n$/, '').split('\n').forEach(l => print(l));
      break; }
    case 'open':
      if (!n) print(`open: ${arg}: no such file or folder`, 'bad'); else go(target);
      break;
    case 'pwd': print('/' + cwd); break;
    case 'whoami': print('guest (read-only)'); break;
    case 'tree': print('/', 'dir'); treeLines(nodes.get(''), '', []).forEach(l => print(l)); break;
    case 'sha256sum': {
      const list = arg ? [deref(n)] : hashed();
      if (!list[0]) print(`sha256sum: ${arg}: no such file`, 'bad');
      else list.forEach(f => f.type === 'dir' ? print(`sha256sum: ${f.path}: is a folder`, 'bad') : print(`${f.hash}  ${f.path}`));
      break; }
    case 'verify': await verify(); break;
    case 'clear': out.textContent = ''; break;
    case 'sudo': print('guest is not in the sudoers file. This will be reported.', 'bad'); break;
    default: print(`${cmd}: command not found. Type help for the list.`, 'bad');
  }
}
input.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ const v = input.value; input.value = ''; run(v); }
  else if (e.key === 'ArrowUp' && hi > 0){ input.value = history[--hi]; e.preventDefault(); }
  else if (e.key === 'ArrowDown'){ hi = Math.min(history.length, hi + 1); input.value = history[hi] || ''; }
});
['help','ls','tree','cat latest','verify'].forEach(c =>
  $('#chips').append(el('button', {class:'btn', type:'button', text:c, onclick:() => run(c)})));

/* ---------- node mesh background ----------
   Purely decorative, local canvas rendering — no network calls, so it
   carries none of the polling/rate-limit concerns that apply to the
   live status panel. Colors are read from the theme's own --green /
   --violet variables so it matches light or dark mode automatically. */
function initMesh(canvasEl, density, maxDist){
  const ctx = canvasEl.getContext('2d');
  let w, h, pts;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hexToRgb = hex => {
    const s = hex.trim().replace('#', '');
    return [0, 2, 4].map(i => parseInt(s.substring(i, i + 2), 16));
  };
  const style = getComputedStyle(document.documentElement);
  const [lr, lg, lb] = hexToRgb(style.getPropertyValue('--green'));
  const [dr, dg, db] = hexToRgb(style.getPropertyValue('--violet'));
  function resize(){ w = canvasEl.width = innerWidth; h = canvasEl.height = innerHeight; }
  function makePts(){
    const count = Math.max(20, Math.floor((w * h) / density));
    pts = Array.from({length: count}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22,
      r: Math.random() * 1.6 + 0.8
    }));
  }
  function step(){
    ctx.clearRect(0, 0, w, h);
    for (const p of pts){
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    }
    for (let a = 0; a < pts.length; a++) for (let b = a + 1; b < pts.length; b++){
      const dx = pts[a].x - pts[b].x, dy = pts[a].y - pts[b].y, dist = Math.hypot(dx, dy);
      if (dist < maxDist){
        ctx.strokeStyle = `rgba(${lr},${lg},${lb},${(1 - dist / maxDist) * 0.28})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(pts[a].x, pts[a].y); ctx.lineTo(pts[b].x, pts[b].y); ctx.stroke();
      }
    }
    for (const p of pts){
      ctx.fillStyle = `rgba(${dr},${dg},${db},0.85)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(step);
  }
  resize(); makePts(); step();
  addEventListener('resize', () => { resize(); makePts(); if (reduceMotion) step(); });
}
initMesh($('#meshCanvas'), 9000, 140);

/* ---------- boot ---------- */
(async () => {
  for (const n of hashed()) await seal(n);
  const live = nodes.get('status/live.json');
  live.live = PLACEHOLDER_LIVE;
  live.body = JSON.stringify(PLACEHOLDER_LIVE, null, 2) + '\n';
  live.size = enc.encode(live.body).length;
  const man = nodes.get('manifest.sha256');
  man.body = hashed().map(n => `${n.hash || 'unavailable'}  ${n.path}`).join('\n') + '\n';
  await seal(man);
  print('Type help, or tap a command.');
  show(currentPath());
})();
</script>
