<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trujara — Decentralized AI Node Services</title>
    <style>
        :root { --accent: #00ff9f; }
        body { 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            padding: 0; 
            background: #000000; 
            color: #00ff9f; 
            line-height: 1.75;
            overflow-x: hidden;
        }
        canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
            opacity: 0.22;
        }
        header { 
            background: rgba(0, 20, 0, 0.95); 
            padding: 110px 20px 80px; 
            text-align: center; 
            border-bottom: 1px solid var(--accent);
            position: relative;
            z-index: 1;
        }
        h1 { 
            font-size: 3.8rem; 
            margin: 0; 
            color: var(--accent); 
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 400;
        }
        .tagline { 
            font-size: 1.35rem; 
            margin: 20px 0 0; 
            opacity: 0.9; 
            letter-spacing: 4px;
        }
        section { 
            max-width: 860px; 
            margin: 0 auto; 
            padding: 75px 20px; 
            position: relative;
            z-index: 1;
        }
        h2 { 
            color: var(--accent); 
            border-bottom: 1px dashed var(--accent); 
            padding-bottom: 12px; 
            margin-bottom: 32px;
            letter-spacing: 2px;
        }
        ul { 
            list-style: none; 
            padding: 0; 
        }
        li { 
            margin: 16px 0; 
            padding-left: 20px; 
            position: relative;
            font-size: 1.08rem;
        }
        li:before {
            content: ">";
            position: absolute;
            left: 0;
            color: var(--accent);
        }
        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 18px 36px;
            border-radius: 0;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.15rem;
            transition: all 0.3s;
            margin-top: 20px;
        }
